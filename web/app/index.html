<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saelora</title>
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body>
    <main class="app">
      <div class="statusbar">
        <a class="statusbar-logo" href="/">Saelora</a>
        <div class="statusbar-right">
          <span class="statusbar-count" id="chatCount">Messages: 0</span>
          <button class="statusbar-theme" type="button" id="themeToggle" aria-label="Toggle theme"></button>
        </div>
      </div>
      <section class="panel hidden" id="view-login">
        <div class="panel-inner">
          <h1 class="h">Login</h1>
          <form class="form" id="loginForm">
            <label class="lab" for="loginEmail">Email</label>
            <input id="loginEmail" type="email" autocomplete="email" />
            <label class="lab" for="loginPassword">Password</label>
            <input id="loginPassword" type="password" autocomplete="current-password" />
            <div class="row">
              <button type="submit" id="loginBtn">Sign in with password</button>
              <a class="link" href="/">Request invite</a>
            </div>
            <div class="row">
              <button class="ghost" type="button" id="passwordLinkBtn">Email me a login link</button>
              <button class="ghost" type="button" id="registerBtn">Create account via email link</button>
            </div>
            <div class="err" id="loginErr"></div>
          </form>
        </div>
      </section>

      <section class="panel hidden" id="view-setup">
        <div class="panel-inner">
          <h1 class="h">Set password</h1>
          <form class="form" id="setupForm">
            <label class="lab" for="setupPassword">Password</label>
            <input id="setupPassword" type="password" autocomplete="new-password" />
            <label class="lab" for="setupConfirm">Confirm</label>
            <input id="setupConfirm" type="password" autocomplete="new-password" />
            <div class="row">
              <button type="submit" id="setupBtn">Save</button>
              <a class="link" href="/app/">Back to login</a>
            </div>
            <div class="err" id="setupErr"></div>
          </form>
        </div>
      </section>

      <section class="panel hidden" id="view-chat">
        <div class="threadsbar">
          <div class="thread-tabs" id="threadTabs"></div>
          <div class="thread-mode-wrap" id="threadModeWrap">
            <button class="thread-mode-btn" type="button" id="threadModeBtn" aria-label="Thread mode" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 7v5l3 2"></path>
              </svg>
              <span class="thread-mode-label" id="threadModeLabel">INS</span>
            </button>
            <div class="thread-mode-menu hidden" id="threadModeMenu" role="menu" aria-label="Select thread mode">
              <button class="thread-mode-item" type="button" data-mode="instant" role="menuitemradio">instant</button>
              <button class="thread-mode-item" type="button" data-mode="hourly" role="menuitemradio">hourly</button>
              <button class="thread-mode-item" type="button" data-mode="daily" role="menuitemradio">daily</button>
              <button class="thread-mode-item" type="button" data-mode="weekly" role="menuitemradio">weekly</button>
            </div>
          </div>
          <button class="thread-btn" type="button" id="addThreadBtn" aria-label="New thread">+</button>
          <button class="thread-btn" type="button" id="archiveThreadBtn">Archive</button>
        </div>
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <textarea
            id="input"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
        </form>
      </section>
    </main>

    <script type="module" src="/app/app.js"></script>
  </body>
</html>
