<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saelora Admin</title>
    <link rel="stylesheet" href="/_saelora-admin/admin.css" />
  </head>
  <body>
    <main class="admin">
      <header class="topbar">
        <a class="brand" href="/">Saelora</a>
        <div class="topbar-right">
          <span class="who" id="adminWho"></span>
          <button class="theme-btn" id="themeToggle" type="button" aria-label="Toggle theme"></button>
          <a class="link" href="/app/">chat</a>
          <button class="ghost" id="logoutBtn" type="button">logout</button>
        </div>
      </header>

      <section class="panel" id="loginView">
        <h1>Admin login</h1>
        <p class="muted">This interface is intentionally unlinked and restricted to the primary admin account.</p>
        <form id="loginForm" class="stack">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="email" required />
          <label for="loginPassword">Password</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required />
          <div class="row">
            <button type="submit">Sign in</button>
          </div>
          <div id="loginErr" class="err"></div>
        </form>
      </section>

      <section class="panel hidden" id="adminView">
        <h1>Administration</h1>

        <div class="stats" id="stats"></div>

        <section class="block">
          <div class="block-head">
            <h2>Config</h2>
            <div class="row">
              <button class="ghost" type="button" id="reloadConfigBtn">Reload</button>
              <button type="button" id="saveConfigBtn">Save config</button>
            </div>
          </div>
          <textarea id="configJson" spellcheck="false"></textarea>
          <div class="note" id="configNote"></div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2>Invites</h2>
            <button class="ghost" type="button" id="refreshInvitesBtn">Refresh</button>
          </div>
          <div class="cols">
            <div>
              <h3>Pending</h3>
              <ul id="pendingInvites" class="list"></ul>
            </div>
            <div>
              <h3>Whitelist</h3>
              <ul id="whitelistInvites" class="list"></ul>
            </div>
          </div>
        </section>

        <section class="block">
          <div class="block-head">
            <h2>Users</h2>
            <button class="ghost" type="button" id="refreshUsersBtn">Refresh</button>
          </div>
          <div id="usersTable"></div>
        </section>
      </section>
    </main>

    <script type="module" src="/_saelora-admin/admin.js"></script>
  </body>
</html>
